<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d141c"/>
      <stop offset="50%" stop-color="#14221f"/>
      <stop offset="100%" stop-color="#0a1017"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="750" fill="url(#bgGrad)"/>
  <rect width="500" height="750" fill="url(#gridPattern)"/>
  
  <!-- Decorative Rings -->
  <circle cx="250" cy="300" r="140" fill="none" stroke="#00e676" stroke-width="2" stroke-dasharray="6 6" opacity="0.3"/>
  <circle cx="250" cy="300" r="110" fill="rgba(0, 230, 118, 0.05)"/>
  
  <!-- Movie Clapperboard / Film Icon -->
  <g transform="translate(190, 240)">
    <rect x="0" y="20" width="120" height="80" rx="8" fill="#1b2836" stroke="#00e676" stroke-width="2"/>
    <polygon points="45,45 85,60 45,75" fill="#00e676"/>
    <!-- Top clapper -->
    <rect x="0" y="0" width="120" height="16" rx="4" fill="#00e676" opacity="0.9"/>
    <line x1="24" y1="0" x2="14" y2="16" stroke="#0d141c" stroke-width="3"/>
    <line x1="50" y1="0" x2="40" y2="16" stroke="#0d141c" stroke-width="3"/>
    <line x1="76" y1="0" x2="66" y2="16" stroke="#0d141c" stroke-width="3"/>
    <line x1="102" y1="0" x2="92" y2="16" stroke="#0d141c" stroke-width="3"/>
  </g>
  
  <!-- Text -->
  <text x="250" y="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">TOLLYWOOD CINEMA</text>
  <text x="250" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#00e676" text-anchor="middle" letter-spacing="1">IRS MOVIE SYSTEM</text>
  <text x="250" y="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#718096" text-anchor="middle">Poster Preview Offline</text>

  <!-- Accent glow border -->
  <rect x="15" y="15" width="470" height="720" rx="12" fill="none" stroke="rgba(0, 230, 118, 0.2)" stroke-width="2"/>
</svg>
