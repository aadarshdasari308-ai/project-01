<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0507"/>
      <stop offset="60%" stop-color="#0a0f16"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#ff5252"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="750" fill="url(#bgGrad)"/>
  
  <!-- Subtle Cinematic Atmospheric Elements -->
  <circle cx="250" cy="220" r="160" fill="#e50914" opacity="0.12" filter="url(#glow)"/>
  <circle cx="250" cy="220" r="120" fill="none" stroke="#e50914" stroke-width="2" stroke-dasharray="8 6" opacity="0.35"/>
  <circle cx="250" cy="220" r="95" fill="none" stroke="#ff5252" stroke-width="1" opacity="0.25"/>

  <!-- Center Decorative Emblem -->
  <g transform="translate(250, 220)">
    <!-- Outer Shield/Badge -->
    <polygon points="0,-60 52,-25 52,35 0,65 -52,35 -52,-25" fill="#1a0507" stroke="#e50914" stroke-width="3" opacity="0.9"/>
    <!-- Inner Icon -->
    <circle cx="0" cy="0" r="32" fill="#e50914" opacity="0.15"/>
    <text x="0" y="8" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#ff5252" text-anchor="middle">&#9733;</text>
  </g>

  <!-- Top Category Banner -->
  <rect x="30" y="30" width="130" height="28" rx="6" fill="#e50914" opacity="0.9"/>
  <text x="95" y="49" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#05080c" text-anchor="middle" letter-spacing="1">KOLLYWOOD</text>

  <!-- Top Right Rating Badge -->
  <rect x="370" y="30" width="100" height="28" rx="6" fill="#131c26" stroke="#ffc107" stroke-width="1.5"/>
  <text x="420" y="49" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffc107" text-anchor="middle">&#9733; 8.3 IMDb</text>

  <!-- Middle Divider Glow -->
  <line x1="80" y1="340" x2="420" y2="340" stroke="#e50914" stroke-width="1.5" opacity="0.4"/>

  <!-- Movie Title Lines -->
  <text x="250" y="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">VIKRAM</text>


  <!-- Year and Primary Genre -->
  <text x="250" y="456" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#ff5252" text-anchor="middle" letter-spacing="2">
    2022 &bull; ACTION
  </text>

  <!-- Director & Cast Panel -->
  <rect x="40" y="580" width="420" height="110" rx="10" fill="#0d141d" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="250" y="612" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle" letter-spacing="1">DIRECTED BY</text>
  <text x="250" y="632" font-family="-apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">LOKESH KANAGARAJ</text>
  <text x="250" y="658" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#8b949e" text-anchor="middle" letter-spacing="1">STARRING</text>
  <text x="250" y="676" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">Kamal Haasan,  Vijay Sethupathi,  Fahadh Faasil</text>

  <!-- Bottom Accent Line -->
  <rect x="0" y="744" width="500" height="6" fill="url(#accentGrad)"/>
  
  <!-- Outer Glow Border -->
  <rect x="10" y="10" width="480" height="730" rx="14" fill="none" stroke="#e50914" stroke-width="1.5" opacity="0.3"/>
</svg>